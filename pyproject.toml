[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "weightfuse"
version = "0.1.0"
description = "Fuse sample-weight signals, then require the fused vector to beat uniform, best single signal, and a magnitude-matched null. numpy-only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Amarel Taylor Scott" }]
keywords = ["machine-learning", "sample-weighting", "weight-fusion", "robust", "tabular", "kaggle"]
dependencies = ["numpy>=1.21"]

[project.scripts]
weightfuse = "weightfuse.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["weightfuse"]
